name: packaging
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'src/briefcast_tools/**'
      - 'cmd/whisperx-worker/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'RELEASE.ps1'
      - 'release.config.json'
      - 'justfile'
      - '.dockerignore'
      - '.env.example'
      - 'whisperx.env.example'
      - 'tests/test_packaging.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  compose-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/test_packaging.py
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [app, cpu, cu128]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and check independent runtime
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if ($env:VARIANT -eq 'app') {
            docker buildx build --load --platform linux/amd64 --sbom=true --provenance=mode=max --build-arg SOURCE_REVISION=$env:GITHUB_SHA -t briefcast:test .
          } else {
            $version = (Get-Content docker/whisperx/VERSION -Raw).Trim()
            docker buildx build --load --platform linux/amd64 --sbom=true --provenance=mode=max -f docker/whisperx/Dockerfile --build-arg RUNTIME=$env:VARIANT --build-arg WORKER_VERSION=$version --build-arg SOURCE_REVISION=$env:GITHUB_SHA -t briefcast:test .
          }
          if ($LASTEXITCODE -ne 0) { throw 'Image build failed' }
          ./scripts/CheckImage.ps1 -Image briefcast:test -Kind $env:VARIANT
