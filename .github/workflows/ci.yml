name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go test
        run: go test ./...

      - name: Go test with race detector
        run: go test -race ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npm run build

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.14"

      - name: Setup just
        uses: taiki-e/install-action@66f567e72f7d264686a8d5f09f38f0829b4feb80 # just

      - name: Python quality gate (just)
        run: just ci-python

      # The dev environment audit above does not cover what the images ship.
      - name: Audit the app image lock file
        run: uv run pip-audit --disable-pip --require-hashes -r docker/app/requirements.lock

      # Report only. The worker locks keep the WhisperX baseline, whose advisories
      # need an engine upgrade and a GPU acceptance run (see "Worker image
      # advisories" in docs/refactor-assessment/2026-11-05/STATUS.md). Advisories
      # become a warning and a job summary table. An audit that cannot run, or
      # fails without reporting advisories, still fails the step.
      - name: Audit the worker image lock files (report only)
        run: |
          status=0
          for lock in docker/whisperx/requirements-cpu.lock docker/whisperx/requirements-cu128.lock; do
            echo "Auditing $lock"
            report="$RUNNER_TEMP/$(basename "$lock").json"
            rm -f "$report"
            rc=0
            uv run pip-audit --disable-pip --require-hashes -r "$lock" --format json --output "$report" || rc=$?
            uv run python - "$lock" "$report" "$rc" <<'PY' || status=1
          import json
          import os
          import sys

          lock, report, rc = sys.argv[1], sys.argv[2], int(sys.argv[3])
          try:
              with open(report, encoding="utf-8") as f:
                  deps = json.load(f)["dependencies"]
          except (OSError, ValueError, KeyError, TypeError) as exc:
              print(f"::error::pip-audit wrote no usable report for {lock} (exit {rc}): {exc}")
              sys.exit(1)
          hit = sorted((d for d in deps if d.get("vulns")), key=lambda d: d["name"])
          skipped = sorted(d["name"] for d in deps if d.get("skip_reason"))
          if rc and not hit:
              print(f"::error::pip-audit failed on {lock} (exit {rc}) without reporting advisories")
              sys.exit(1)
          lines = [f"### `{lock}`", ""]
          if hit:
              total = sum(len(d["vulns"]) for d in hit)
              print(
                  f"::warning title=Worker lock advisories (report only)::{lock}: "
                  f"{total} advisories in {len(hit)} packages. See the job summary."
              )
              lines += [
                  f"{total} advisories in {len(hit)} packages (report only).",
                  "",
                  "| Package | Version | Advisories | Without a fixed release |",
                  "| --- | --- | --- | --- |",
              ]
              for d in hit:
                  no_fix = sum(1 for v in d["vulns"] if not v.get("fix_versions"))
                  lines.append(f"| {d['name']} | {d['version']} | {len(d['vulns'])} | {no_fix} |")
          else:
              lines.append("No known advisories.")
          if skipped:
              lines += ["", "Not audited: " + ", ".join(skipped)]
          text = "\n".join(lines) + "\n\n"
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(text)
          PY
          done
          exit "$status"
