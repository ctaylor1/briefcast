openapi: 3.1.0
info:
  title: Briefcast WhisperX worker private API
  version: 1.0.0
  description: >-
    Contract major 1. Only the app and worker use this API. Unknown request fields
    are rejected. Response consumers tolerate unknown optional fields. Normative
    lifecycle, limits and hashing rules are in CONTRACT.md.
servers:
  - url: http://whisperx:8090
security:
  - bearerToken: []
paths:
  /health/live:
    get:
      operationId: live
      security: []
      responses:
        '200':
          description: Process is alive; no model or store access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Supervisor can accept work; saturation is reported separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Draining or runtime prerequisites unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/capabilities:
    get:
      operationId: capabilities
      responses:
        '200':
          description: Authenticated compatibility and capacity information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    put:
      operationId: putJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '201':
          description: Request durably accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '200':
          description: Replay of the same canonical JSON request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          description: Capacity exhausted; request was not accepted.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying the same UUID and request bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: getJob
      responses:
        '200':
          description: Persisted job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs/{job_id}/result:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getResult
      responses:
        '200':
          description: Verified durable result, limited to 64 MiB by default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      responses:
        '200':
          description: Current persisted state; cancelling is not terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs/{job_id}/ack:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: ackJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        '200':
          description: Receipt durably recorded, including identical repeat ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/drain:
    post:
      operationId: drain
      responses:
        '200':
          description: Durable drain state; existing accepted jobs continue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/resume:
    post:
      operationId: resume
      responses:
        '200':
          description: Durable accepting state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed or unsupported request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or incorrect bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request identity, result state or digest conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No persisted record for this UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Acknowledged result artifact was pruned; tombstone remains.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: Request exceeds the configured control-body limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Drain, storage or runtime prerequisite failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
      additionalProperties: false
    JobRequest:
      type: object
      required: [contract_version, deployment_id, episode_id, generation_id, attempt, input, engine_profile, options, resume_from_job_id]
      properties:
        contract_version:
          type: integer
          const: 1
        deployment_id:
          type: string
          format: uuid
        episode_id:
          type: string
          format: uuid
        generation_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 1000
        input:
          $ref: '#/components/schemas/MediaInput'
        engine_profile:
          type: string
          minLength: 1
          maxLength: 128
        options:
          $ref: '#/components/schemas/TranscriptionOptions'
        resume_from_job_id:
          type: [string, 'null']
          format: uuid
      additionalProperties: false
    MediaInput:
      type: object
      required: [relative_path, size_bytes, sha256]
      properties:
        relative_path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Slash-separated path beneath media root; no absolute, drive, UNC, traversal or symlink escape.
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
      additionalProperties: false
    TranscriptionOptions:
      type: object
      required: [model, language, chunk_seconds, align, diarization, diarization_model, min_speakers, max_speakers, vad_method, asr_options, vad_options]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: Must be in authenticated capabilities; never a filesystem path or URL.
        language:
          type: string
          minLength: 1
          maxLength: 32
        chunk_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        align:
          type: boolean
        diarization:
          type: boolean
        diarization_model:
          type: string
          minLength: 1
          maxLength: 256
          description: Must be in authenticated capabilities.
        min_speakers:
          type: integer
          minimum: 1
          maximum: 32
        max_speakers:
          type: integer
          minimum: 1
          maximum: 32
          description: Must be greater than or equal to min_speakers.
        vad_method:
          type: string
          enum: [pyannote, silero]
        asr_options:
          $ref: '#/components/schemas/AsrOptions'
        vad_options:
          $ref: '#/components/schemas/VadOptions'
      additionalProperties: false
    AsrOptions:
      type: object
      required: [beam_size, patience, condition_on_previous_text, initial_prompt]
      properties:
        beam_size:
          type: integer
          minimum: 1
          maximum: 64
        patience:
          type: number
          minimum: 0
          maximum: 10
        condition_on_previous_text:
          type: boolean
        initial_prompt:
          type: string
          maxLength: 4096
      additionalProperties: false
    VadOptions:
      type: object
      required: [chunk_size, vad_onset, vad_offset]
      properties:
        chunk_size:
          type: integer
          minimum: 1
          maximum: 3600
        vad_onset:
          type: number
          minimum: 0
          maximum: 1
        vad_offset:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
    JobStatus:
      type: object
      required: [contract_version, job_id, request_digest, worker_instance_id, state, revision, stage, percent, completed_seconds, total_seconds, attempt, checkpoint, effective_config, created_at, updated_at, started_at, finished_at, error]
      properties:
        contract_version:
          type: integer
          const: 1
        job_id:
          type: string
          format: uuid
        request_digest:
          $ref: '#/components/schemas/Sha256'
        worker_instance_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
        revision:
          type: integer
          minimum: 1
        stage:
          type: string
          maxLength: 64
        percent:
          type: integer
          minimum: 0
          maximum: 100
        completed_seconds:
          type: number
          minimum: 0
        total_seconds:
          type: number
          minimum: 0
        attempt:
          type: integer
          minimum: 1
        checkpoint:
          $ref: '#/components/schemas/CheckpointSummary'
        effective_config:
          $ref: '#/components/schemas/EffectiveConfig'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/WorkerError'
            - type: 'null'
      additionalProperties: true
    CheckpointSummary:
      type: object
      required: [format, compatible, completed_seconds, segment_count, resume_from_job_id]
      properties:
        format:
          type: string
          maxLength: 64
        compatible:
          type: boolean
        completed_seconds:
          type: number
          minimum: 0
        segment_count:
          type: integer
          minimum: 0
        resume_from_job_id:
          type: [string, 'null']
          format: uuid
      additionalProperties: true
    EffectiveConfig:
      type: object
      required: [engine_profile, options_sha256, device, compute_type, batch_size, execution_timeout_seconds]
      properties:
        engine_profile:
          type: string
        options_sha256:
          $ref: '#/components/schemas/Sha256'
        device:
          type: string
          enum: [cpu, cuda]
        compute_type:
          type: string
        batch_size:
          type: integer
          minimum: 1
        execution_timeout_seconds:
          type: integer
          minimum: 1
      additionalProperties: true
    JobResult:
      type: object
      required: [contract_version, job_id, request_digest, result_sha256, transcript]
      properties:
        contract_version:
          type: integer
          const: 1
        job_id:
          type: string
          format: uuid
        request_digest:
          $ref: '#/components/schemas/Sha256'
        result_sha256:
          $ref: '#/components/schemas/Sha256'
        transcript:
          $ref: '#/components/schemas/Transcript'
      additionalProperties: true
    Transcript:
      type: object
      required: [provider, model, language, device, compute_type, batch_size, asr_options, vad_options, vad_method, aligned, alignment, diarization, segments_pre_align, segments, metadata]
      properties:
        provider:
          type: string
          const: whisperx
        model:
          type: string
        language:
          type: string
        device:
          type: string
          enum: [cpu, cuda]
        compute_type:
          type: string
        batch_size:
          type: integer
          minimum: 1
        asr_options:
          $ref: '#/components/schemas/AsrOptions'
        vad_options:
          $ref: '#/components/schemas/VadOptions'
        vad_method:
          type: string
          enum: [pyannote, silero]
        aligned:
          type: boolean
        alignment:
          $ref: '#/components/schemas/AlignmentOutcome'
        diarization:
          $ref: '#/components/schemas/DiarizationOutcome'
        segments_pre_align:
          type: array
          maxItems: 100000
          items:
            $ref: '#/components/schemas/Segment'
        segments:
          type: array
          maxItems: 100000
          items:
            $ref: '#/components/schemas/Segment'
        metadata:
          $ref: '#/components/schemas/ResultMetadata'
      additionalProperties: true
    Segment:
      type: object
      required: [text]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        text:
          type: string
          maxLength: 100000
        speaker:
          type: string
          maxLength: 128
        words:
          type: array
          maxItems: 100000
          items:
            $ref: '#/components/schemas/Word'
      additionalProperties: true
      description: Optional timing and speaker fields remain absent when WhisperX omits them. Present end must be >= present start.
    Word:
      type: object
      required: [word]
      properties:
        word:
          type: string
          maxLength: 10000
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        score:
          type: number
          minimum: 0
          maximum: 1
        speaker:
          type: string
          maxLength: 128
      additionalProperties: true
      description: Present end must be >= present start. Missing timestamps are preserved.
    AlignmentOutcome:
      type: object
      required: [requested, used, error]
      properties:
        requested:
          type: boolean
        used:
          type: boolean
        error:
          type: string
          maxLength: 2048
      additionalProperties: true
    DiarizationOutcome:
      type: object
      required: [enabled, used, model, min_speakers, max_speakers, error]
      properties:
        enabled:
          type: boolean
        used:
          type: boolean
        model:
          type: string
        min_speakers:
          type: integer
        max_speakers:
          type: integer
        error:
          type: string
          maxLength: 2048
      additionalProperties: true
    ResultMetadata:
      type: object
      required: [generated_at, whisperx_version, torch_version, worker_version, pipeline_version, api_version, engine_profile, input_sha256, options_sha256, job_id, package_versions, resumed_from_checkpoint, checkpoint_segment_count]
      properties:
        generated_at:
          type: string
          format: date-time
        whisperx_version:
          type: string
        torch_version:
          type: string
        worker_version:
          type: string
        pipeline_version:
          type: string
        api_version:
          type: string
        engine_profile:
          type: string
        input_sha256:
          $ref: '#/components/schemas/Sha256'
        options_sha256:
          $ref: '#/components/schemas/Sha256'
        job_id:
          type: string
          format: uuid
        package_versions:
          type: object
          additionalProperties:
            type: string
        resumed_from_checkpoint:
          type: boolean
        checkpoint_segment_count:
          type: integer
          minimum: 0
      additionalProperties: true
    AckRequest:
      type: object
      required: [result_sha256]
      properties:
        result_sha256:
          $ref: '#/components/schemas/Sha256'
      additionalProperties: false
    AckResponse:
      type: object
      required: [job_id, result_sha256, acknowledged_at]
      properties:
        job_id:
          type: string
          format: uuid
        result_sha256:
          $ref: '#/components/schemas/Sha256'
        acknowledged_at:
          type: string
          format: date-time
      additionalProperties: true
    MaintenanceStatus:
      type: object
      required: [accepting, queued, running, unacknowledged_results]
      properties:
        accepting:
          type: boolean
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        unacknowledged_results:
          type: integer
          minimum: 0
      additionalProperties: true
    Capabilities:
      type: object
      required: [contract_versions, worker_instance_id, worker_version, pipeline_version, engine_profile, package_versions, supported_models, supported_diarization_models, supported_vad_methods, checkpoint_formats, device, compute_type, model_ready, capacity]
      properties:
        contract_versions:
          type: array
          items:
            type: integer
          minItems: 1
        worker_instance_id:
          type: string
          format: uuid
        worker_version:
          type: string
        pipeline_version:
          type: string
        engine_profile:
          type: string
        package_versions:
          type: object
          additionalProperties:
            type: string
        supported_models:
          type: array
          items:
            type: string
        supported_diarization_models:
          type: array
          items:
            type: string
        supported_vad_methods:
          type: array
          items:
            type: string
        checkpoint_formats:
          type: array
          items:
            type: string
        device:
          type: string
          enum: [cpu, cuda]
        compute_type:
          type: string
        model_ready:
          type: boolean
        capacity:
          $ref: '#/components/schemas/Capacity'
      additionalProperties: true
    Capacity:
      type: object
      required: [max_running, max_waiting, running, waiting, accepting]
      properties:
        max_running:
          type: integer
          minimum: 1
        max_waiting:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
        accepting:
          type: boolean
      additionalProperties: true
    WorkerError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [WORKER_UNAVAILABLE, BUSY, MODEL_UNAVAILABLE, MODEL_ACCESS_DENIED, INVALID_CONFIG, INPUT_MISSING, INPUT_CHANGED, INPUT_UNREADABLE, STATE_UNAVAILABLE, CHECKPOINT_INCOMPATIBLE, TIMEOUT, CANCELLED, INTERNAL]
        message:
          type: string
          maxLength: 2048
        retryable:
          type: boolean
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/WorkerError'
      additionalProperties: true
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
